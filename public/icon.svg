<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <radialGradient id="bgGlow" cx="50%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#090d16"/>
    </radialGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24"/>
      <stop offset="100%" stop-color="#d97706"/>
    </linearGradient>
    <linearGradient id="blueGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#60a5fa"/>
      <stop offset="100%" stop-color="#2563eb"/>
    </linearGradient>
    <linearGradient id="redGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f87171"/>
      <stop offset="100%" stop-color="#dc2626"/>
    </linearGradient>
    <linearGradient id="purpleGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#e879f9"/>
      <stop offset="100%" stop-color="#c026d3"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#0284c7" flood-opacity="0.35"/>
    </filter>
  </defs>

  <!-- Background container for Android icon -->
  <rect width="512" height="512" rx="115" fill="url(#bgGlow)"/>

  <!-- Outer ambient ring -->
  <circle cx="256" cy="256" r="195" fill="none" stroke="#334155" stroke-width="3" stroke-dasharray="8 6" opacity="0.4"/>

  <!-- Isometric 3D Logo Structure -->
  <g filter="url(#glow)" transform="translate(0, 0)">
    <!-- Top golden facet -->
    <polygon points="256,105 385,178 256,252 127,178" fill="url(#goldGrad)"/>
    
    <!-- Left blue facet -->
    <polygon points="127,178 256,252 256,380 127,306" fill="url(#blueGrad)"/>
    
    <!-- Right red facet -->
    <polygon points="256,252 385,178 385,306 256,380" fill="url(#redGrad)"/>

    <!-- Accent lower magenta polygon -->
    <polygon points="256,306 385,232 385,306 256,380" fill="url(#purpleGrad)" opacity="0.85"/>

    <!-- Central Diamond Core highlight -->
    <polygon points="256,252 315,217 256,182 197,217" fill="#fef08a" opacity="0.9"/>
  </g>

  <!-- Brand Typography accent at bottom -->
  <text x="256" y="442" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="900" font-size="34" letter-spacing="4" fill="#ffffff">SIMPLY FUNDS</text>
  <text x="256" y="470" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="700" font-size="16" letter-spacing="2" fill="#fbbf24">DSA LOAN APP</text>
</svg>
